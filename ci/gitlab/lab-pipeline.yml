# Review template: copy to the django.nv project's .gitlab-ci.yml manually.
# Prerequisites and file-type CI variables are documented in README.md.

default:
  image: docker:24.0.5-cli
  services:
    - name: docker:24.0.5-dind
      alias: docker
      command: ["--insecure-registry=192.168.26.0/24"]
  before_script:
    - docker info

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  PROD_HOSTNAME: "192.168.26.143"
  PROD_USERNAME: "vagrant"

stages:
  - build
  - deploy
  - test

build:
  stage: build
  script:
    - |
      set -eu
      : "${CI_REGISTRY:?Enable the project container registry first}"
      : "${CI_REGISTRY_IMAGE:?Project registry image path is missing}"
      printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
      docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
      docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"

prod:
  stage: deploy
  image: alpine:3.21
  services: []
  resource_group: lab-app
  environment:
    name: lab
    url: http://$PROD_HOSTNAME:8000
  before_script:
    - apk add --no-cache openssh-client curl
    - |
      set -eu
      : "${PROD_SSH_PRIVKEY:?Set this as a GitLab File variable}"
      : "${SSH_KNOWN_HOSTS:?Set verified host keys as a GitLab File variable}"
      install -d -m 700 ~/.ssh
      cp "$PROD_SSH_PRIVKEY" ~/.ssh/id_rsa
      cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
      chmod 600 ~/.ssh/id_rsa ~/.ssh/known_hosts
      printf 'Host *\n  BatchMode yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 15\n' > ~/.ssh/config
      chmod 600 ~/.ssh/config
  script:
    - |
      set -eu
      # These values are used in remote shell commands: allow only expected characters.
      case "$PROD_HOSTNAME" in ''|*[!a-zA-Z0-9.-]*) echo 'Invalid PROD_HOSTNAME'; exit 1;; esac
      case "$PROD_USERNAME" in ''|*[!a-zA-Z0-9_-]*) echo 'Invalid PROD_USERNAME'; exit 1;; esac
      case "$CI_REGISTRY" in ''|*[!a-zA-Z0-9.:-]*) echo 'Invalid registry'; exit 1;; esac
      case "$CI_REGISTRY_USER" in ''|*[!a-zA-Z0-9_.+-]*) echo 'Invalid registry user'; exit 1;; esac
      IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
      case "$IMAGE" in *[!a-zA-Z0-9_./:@-]*) echo 'Invalid image name'; exit 1;; esac
      REMOTE="$PROD_USERNAME@$PROD_HOSTNAME"
      REGISTRY_CONFIG="/tmp/devsecops-registry-$CI_JOB_ID"
      # Keep the short-lived registry credentials isolated; clean them up on exit.
      trap 'ssh "$REMOTE" "sudo -n docker --config $REGISTRY_CONFIG logout $CI_REGISTRY" >/dev/null 2>&1 || true' EXIT
      printf '%s' "$CI_REGISTRY_PASSWORD" | ssh "$REMOTE" "sudo -n docker --config $REGISTRY_CONFIG login '$CI_REGISTRY' --username '$CI_REGISTRY_USER' --password-stdin"
      ssh "$REMOTE" "set -eu
        sudo -n docker --config $REGISTRY_CONFIG pull '$IMAGE'
        if sudo -n docker container inspect devsecops-django >/dev/null 2>&1; then
          sudo -n docker rm -f devsecops-django
        fi
        sudo -n docker run -d --name devsecops-django --restart unless-stopped -p 8000:8000 '$IMAGE'
      "
      # Tests start only once the new application responds successfully.
      ready=false
      for attempt in $(seq 1 30); do
        if curl --fail --silent --show-error --max-time 5 "http://$PROD_HOSTNAME:8000/" >/dev/null; then
          ready=true
          break
        fi
        sleep 2
      done
      if [ "$ready" != true ]; then
        echo 'Application did not become ready; inspect devsecops-django logs on the app VM.'
        exit 1
      fi

.scan:
  stage: test
  allow_failure: true
  # Copy reports out of the DinD container explicitly, including after scan failure.
  # Do not use --rm: after_script needs the stopped container to retrieve the report.
  after_script:
    - docker cp "scan:/tmp/$REPORT_FILE" "$CI_PROJECT_DIR/$REPORT_FILE"
    - docker rm -f scan
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - $REPORT_FILE

nikto:
  extends: .scan
  variables:
    REPORT_FILE: nikto-output.xml
  script:
    - docker create --name scan hysnsec/nikto -h "http://$PROD_HOSTNAME:8000" -o /tmp/nikto-output.xml
    - docker start --attach scan

sslscan:
  extends: .scan
  variables:
    REPORT_FILE: sslyze-output.json
  script:
    - docker create --name scan hysnsec/sslyze "$PROD_HOSTNAME:443" --json_out /tmp/sslyze-output.json
    - docker start --attach scan

nmap:
  extends: .scan
  variables:
    REPORT_FILE: nmap-output.xml
  script:
    - docker create --name scan hysnsec/nmap "$PROD_HOSTNAME" -p 80,443,8000 -oX /tmp/nmap-output.xml
    - docker start --attach scan
