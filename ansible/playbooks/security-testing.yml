---
- name: Run security testing playbooks from the Jump Box
  hosts: localhost
  connection: local
  gather_facts: true
  vars:
    app_host: "{{ app_host | default(lookup('env', 'APP_HOST')) }}"
  tasks:
    - name: Require a runtime application address
      ansible.builtin.assert:
        that:
          - app_host | length > 0
        fail_msg: "Pass app_host with --extra-vars or set APP_HOST."
    - name: Check application endpoint from the Jump Box
      ansible.builtin.uri:
        url: "http://{{ app_host }}:8000"
        method: GET
        status_code: [200, 301, 302, 404]
        timeout: 10
