---
- name: Install Jump Box security tooling
  ansible.builtin.apt:
    name:
      - nmap
      - nikto
      - python3-venv
      - python3-pip
      - jq
      - ansible-core
      - docker.io
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Enable and start Docker on the jumpbox
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Allow the vagrant user to run Docker without sudo
  ansible.builtin.user:
    name: vagrant
    groups: docker
    append: true

- name: Read the default boot target
  ansible.builtin.command: systemctl get-default
  register: jumpbox_boot_target
  changed_when: false

- name: Boot the jumpbox in console mode
  ansible.builtin.command: systemctl set-default multi-user.target
  when: jumpbox_boot_target.stdout != 'multi-user.target'

- name: Keep SSH available on the headless jumpbox
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: started

- name: Prevent the jumpbox from suspending while idle
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - sleep.target
    - suspend.target
    - hibernate.target
    - hybrid-sleep.target

- name: Create lab tool workspace
  ansible.builtin.file:
    path: /opt/devsecops-lab
    state: directory
    mode: "0755"

- name: Write runtime security test
  ansible.builtin.copy:
    dest: /opt/devsecops-lab/security-testing.yml
    mode: "0644"
    content: |
      ---
      - name: Check Django training target
        hosts: localhost
        connection: local
        tasks:
          - name: Check application endpoint
            ansible.builtin.uri:
              url: "http://{{ hostvars['app']['ansible_host'] }}:8000"
              status_code: 200
              timeout: 10

- name: Write Jump Box testing instructions
  ansible.builtin.copy:
    dest: /opt/devsecops-lab/TESTING.md
    mode: "0644"
    content: |
      Run from this node:
      ansible-playbook /opt/devsecops-lab/security-testing.yml
