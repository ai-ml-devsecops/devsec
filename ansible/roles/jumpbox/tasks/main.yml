---
- name: Install Jump Box security tooling
  ansible.builtin.apt:
    name:
      - nmap
      - nikto
      - python3-venv
      - jq
      - ansible-core
      - xfce4
      - lightdm
      - dbus-x11
    state: present
  environment:
    DEBIAN_FRONTEND: noninteractive

- name: Install Google Chrome
  ansible.builtin.apt:
    deb: https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    state: present

- name: Configure automatic graphical login for the jumpbox
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm.conf.d/50-jumpbox.conf
    mode: "0644"
    content: |
      [Seat:*]
      autologin-user=vagrant
      user-session=xfce

- name: Set LightDM as the default display manager
  ansible.builtin.copy:
    dest: /etc/X11/default-display-manager
    mode: "0644"
    content: |
      /usr/sbin/lightdm

- name: Reset graphical login failure state
  ansible.builtin.command: systemctl reset-failed lightdm
  changed_when: false

- name: Enable graphical login
  ansible.builtin.service:
    name: lightdm
    enabled: true
    state: started

- name: Create lab tool workspace
  ansible.builtin.file:
    path: /opt/devsecops-lab
    state: directory
    mode: "0755"

- name: Write runtime security test
  ansible.builtin.copy:
    dest: /opt/devsecops-lab/security-testing.yml
    mode: "0644"
    content: |
      ---
      - name: Check Django training target
        hosts: localhost
        connection: local
        tasks:
          - name: Check application endpoint
            ansible.builtin.uri:
              url: "http://{{ hostvars['app']['ansible_host'] }}:8000"
              status_code: 200
              timeout: 10

- name: Write Jump Box testing instructions
  ansible.builtin.copy:
    dest: /opt/devsecops-lab/TESTING.md
    mode: "0644"
    content: |
      Run from this node:
      ansible-playbook /opt/devsecops-lab/security-testing.yml
