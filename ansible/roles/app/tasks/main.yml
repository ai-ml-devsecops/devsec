---
- name: Install application prerequisites
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - git
      - nginx
      - openssl
    state: present

- name: Configure Docker to allow the lab registry over HTTP
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "insecure-registries": ["{{ hostvars['gitlab']['ansible_host'] }}:5050"]
      }
  register: app_docker_registry_config

- name: Restart Docker after registry configuration changes
  ansible.builtin.service:
    name: docker
    state: restarted
  when: app_docker_registry_config.changed

- name: Create application workspace
  ansible.builtin.file:
    path: /opt/devsecops-app
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Clone django.nv from the upstream training source
  ansible.builtin.git:
    repo: https://gitlab.practical-devsecops.training/pdso/django.nv.git
    dest: /opt/devsecops-app/django.nv
    version: main
    force: true

- name: Build the django.nv container image
  ansible.builtin.command:
    argv:
      - docker
      - build
      - -t
      - django-nv
      - /opt/devsecops-app/django.nv
  changed_when: true

- name: Run the django.nv training target
  ansible.builtin.command:
    argv:
      - docker
      - run
      - -d
      - --name
      - devsecops-django
      - --restart
      - unless-stopped
      - -p
      - "8000:8000"
      - django-nv
  register: django_run
  changed_when: true
  failed_when: django_run.rc != 0 and 'is already in use' not in django_run.stderr

- name: Create application TLS directory
  ansible.builtin.file:
    path: /etc/nginx/tls
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Check application certificate
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -checkend
      - "0"
      - -noout
      - -in
      - /etc/nginx/tls/app.crt
  register: app_certificate_check
  changed_when: false
  failed_when: false

- name: Check application private key
  ansible.builtin.command:
    argv:
      - openssl
      - pkey
      - -check
      - -noout
      - -in
      - /etc/nginx/tls/app.key
  register: app_private_key_check
  changed_when: false
  failed_when: false

- name: Generate self-signed application certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -nodes
      - -newkey
      - rsa:2048
      - -days
      - "365"
      - -keyout
      - /etc/nginx/tls/app.key
      - -out
      - /etc/nginx/tls/app.crt
      - -subj
      - "/CN={{ ansible_host }}"
  when: app_certificate_check.rc != 0 or app_private_key_check.rc != 0
  notify: Restart Nginx

- name: Configure Nginx TLS reverse proxy
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: "0644"
    content: |
      server {
          listen 443 ssl default_server;
          listen [::]:443 ssl default_server;

          ssl_certificate /etc/nginx/tls/app.crt;
          ssl_certificate_key /etc/nginx/tls/app.key;

          location / {
              proxy_pass http://127.0.0.1:8000;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
          }
      }
  notify: Restart Nginx

- name: Validate Nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start Nginx
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
