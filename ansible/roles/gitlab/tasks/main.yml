---
- name: Create GitLab workspace
  ansible.builtin.file:
    path: /opt/devsecops-gitlab
    state: directory
    mode: "0755"

- name: Deploy GitLab container definition
  ansible.builtin.copy:
    dest: /opt/devsecops-gitlab/compose.yml
    mode: "0644"
    content: |
      services:
        gitlab:
          image: gitlab/gitlab-ce:17.11.6-ce.0
          container_name: devsecops-gitlab
          hostname: gitlab
          restart: unless-stopped
          shm_size: "256m"
          ports:
            - "80:80"
            - "443:443"
            - "2222:22"
            - "5050:5050"
          volumes:
            - /opt/devsecops-gitlab/config:/etc/gitlab
            - /opt/devsecops-gitlab/logs:/var/log/gitlab
            - /opt/devsecops-gitlab/data:/var/opt/gitlab
          environment:
            GITLAB_OMNIBUS_CONFIG: |
              external_url 'http://{{ hostvars["gitlab"]["ansible_host"] }}'
              registry_external_url 'http://{{ hostvars["gitlab"]["ansible_host"] }}:5050'
              registry['enable'] = true
              gitlab_rails['initial_root_password'] = '{{ gitlab_initial_root_password | default("ChangeMeLab123!") }}'

- name: Start GitLab
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - /opt/devsecops-gitlab/compose.yml
      - up
      - -d
  changed_when: true

- name: Create GitLab bootstrap script directory
  ansible.builtin.file:
    path: /opt/devsecops-gitlab/scripts
    state: directory
    mode: "0755"

- name: Copy GitLab bootstrap scripts
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/devsecops-gitlab/scripts/{{ item | basename }}"
    mode: "0644"
  loop:
    - "{{ playbook_dir }}/../../scripts/create-gitlab-token.rb"
    - "{{ playbook_dir }}/../../scripts/setup-gitlab-api.py"

# GitLab's first-boot reconfigure can take several minutes even after the container is "up"
- name: Wait for GitLab to become ready
  ansible.builtin.uri:
    url: http://localhost/api/v4/version
    status_code: [200, 401]
  register: gitlab_readiness
  until: gitlab_readiness.status in [200, 401]
  retries: 60
  delay: 10

- name: Generate ephemeral GitLab API token
  ansible.builtin.shell:
    cmd: docker exec -i devsecops-gitlab gitlab-rails runner - < /opt/devsecops-gitlab/scripts/create-gitlab-token.rb
  register: gitlab_token_result
  changed_when: true

- name: Record the API token
  ansible.builtin.set_fact:
    gitlab_api_token: "{{ gitlab_token_result.stdout_lines[-1] }}"

# Catches a stale/rejected token (the earlier 401 bootstrap failure) before it is used downstream
- name: Validate the API token against GitLab
  ansible.builtin.uri:
    url: http://localhost/api/v4/personal_access_tokens/self
    headers:
      PRIVATE-TOKEN: "{{ gitlab_api_token }}"
    status_code: 200
  register: gitlab_token_check
  until: gitlab_token_check.status == 200
  retries: 5
  delay: 5

- name: Enable Git repository imports for the training project
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - devsecops-gitlab
      - gitlab-rails
      - runner
      - "ApplicationSetting.current.update!(import_sources: ['git'])"
  changed_when: true

- name: Ensure the pdso/django.nv project exists and is importing
  ansible.builtin.command:
    argv:
      - python3
      - /opt/devsecops-gitlab/scripts/setup-gitlab-api.py
      - --url
      - http://localhost
      - --token
      - "{{ gitlab_api_token }}"
  register: gitlab_project_result
  changed_when: true
  until: gitlab_project_result.rc == 0
  retries: 12
  delay: 5

- name: Show project bootstrap result
  ansible.builtin.debug:
    var: gitlab_project_result.stdout_lines

- name: Create a project runner registration token
  ansible.builtin.command:
    argv:
      - python3
      - /opt/devsecops-gitlab/scripts/setup-gitlab-api.py
      - --url
      - http://localhost
      - --token
      - "{{ gitlab_api_token }}"
      - --ensure-runner
  register: gitlab_runner_result
  changed_when: true

- name: Record the runner auth token
  ansible.builtin.set_fact:
    gitlab_runner_auth_token: "{{ gitlab_runner_result.stdout_lines | select('match', '^RUNNER_TOKEN=') | first | regex_replace('^RUNNER_TOKEN=', '') }}"
