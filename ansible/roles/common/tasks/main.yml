---
- name: Install baseline packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - git
      - docker.io
      - docker-compose-v2
      - python3
      - python3-pip
      - unzip
    state: present
    update_cache: true

- name: Enable Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Create Docker systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

- name: Preserve Docker legacy link environment variables for GitLab Runner
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker.service.d/legacy-links.conf
    mode: "0644"
    content: |
      [Service]
      Environment="DOCKER_KEEP_DEPRECATED_LEGACY_LINKS_ENV_VARS=1"
  notify:
    - Reload systemd
    - Restart Docker
