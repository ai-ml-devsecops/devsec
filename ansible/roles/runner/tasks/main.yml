---
- name: Create runner workspace
  ansible.builtin.file:
    path: /opt/devsecops-runner
    state: directory
    mode: "0755"

- name: Deploy GitLab Runner container definition
  ansible.builtin.copy:
    dest: /opt/devsecops-runner/compose.yml
    mode: "0644"
    content: |
      services:
        runner:
          image: gitlab/gitlab-runner:v17.11.0
          container_name: devsecops-runner
          restart: unless-stopped
          volumes:
            - /opt/devsecops-runner/config:/etc/gitlab-runner
            - /var/run/docker.sock:/var/run/docker.sock

- name: Start GitLab Runner
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - -f
      - /opt/devsecops-runner/compose.yml
      - up
      - -d
  changed_when: true

- name: Write runner registration instructions
  ansible.builtin.copy:
    dest: /opt/devsecops-runner/README.txt
    mode: "0644"
    content: |
      Register this runner after obtaining a token from GitLab:
      docker exec -it devsecops-runner gitlab-runner register
      GitLab URL: http://{{ hostvars[groups["gitlab"][0]]["ansible_host"] }}
